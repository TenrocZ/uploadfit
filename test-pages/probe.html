<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UploadFit S0 File 回填探针</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { max-width: 960px; margin: 0 auto; padding: 24px; color: #162033; background: #f5f7fb; }
      section { margin: 16px 0; padding: 16px; background: #fff; border: 1px solid #dfe5ef; border-radius: 12px; }
      h1 { margin-top: 0; }
      button { margin: 4px 8px 4px 0; padding: 8px 12px; border: 1px solid #b8c4d8; border-radius: 8px; background: #fff; cursor: pointer; }
      button:hover { background: #eef3fb; }
      code, pre { font-family: ui-monospace, monospace; }
      pre { min-height: 120px; max-height: 360px; overflow: auto; padding: 12px; background: #101827; color: #dbeafe; border-radius: 8px; white-space: pre-wrap; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
      .value { font-weight: 600; overflow-wrap: anywhere; }
      .ok { color: #087443; }
      .warn { color: #a45a00; }
    </style>
  </head>
  <body>
    <h1>UploadFit S0：File → DataTransfer → input.files → change</h1>
    <p>本页只使用脚本生成的内存文件，不选择、读取或上传真实文件。</p>

    <section>
      <label for="probe-file">普通单文件图片输入：</label>
      <input id="probe-file" type="file" accept="image/png,image/jpeg">
      <div class="grid">
        <p>当前文件：<span id="current-file" class="value">无</span></p>
        <p>回填调用次数：<span id="injection-count" class="value">0</span></p>
        <p>最近一次验证：<span id="verification" class="value">未执行</span></p>
      </div>
      <button id="inject-b" type="button">生成并回填 B 文件</button>
      <button id="restore-a" type="button">恢复 A 文件</button>
      <button id="clear-log" type="button">清空日志</button>
    </section>

    <section>
      <h2>事件日志</h2>
      <p>记录 document 捕获、input 目标、document 冒泡的顺序、次数和 <code>isTrusted</code>。</p>
      <pre id="event-log" aria-live="polite">等待事件……</pre>
    </section>

    <section>
      <h2>能力摘要</h2>
      <pre id="capability-summary">检测中……</pre>
    </section>

    <script src="./probe.js"></script>
  </body>
</html>
