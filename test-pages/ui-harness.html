<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UploadFit S5 UI 自动化 Harness</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="site-header">
      <p class="eyebrow">UploadFit / S5 automation</p>
      <h1>确认路径自动化 Harness</h1>
      <p class="lede">本页只为 Chromium 自动化开放 Shadow DOM；业务场景、文件输入和按钮仍走真实 DOM 交互。生产页继续使用 closed Shadow DOM。</p>
    </header>
    <main id="scenario-root"><noscript>需要启用 JavaScript。</noscript></main>
    <script src="./scenarios.js"></script>
    <script src="../dist/uploadfit.test.js"></script>
    <script>
      (function () {
        const api = globalThis.__uploadfit_debug_bundle__;
        const session = api.bootstrap({
          documentRef: document,
          globalRef: window,
          ruleProvider: null,
          ui: false
        });
        const controller = session.controller;
        const ui = api.createUploadFitUi({
          documentRef: document,
          globalRef: window,
          controller,
          config: { shadowMode: 'open' },
          onClose: () => session.cleanup()
        });
        controller.start();
        globalThis.__uploadfit_s5_ui_harness__ = { controller, ui, session };
      }());
    </script>
  </body>
</html>
