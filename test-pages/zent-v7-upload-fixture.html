<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="uploadfit-source" content="https://youzan.github.io/zent-v7/zh/component/upload">
    <title>Zent v7 Upload 回归夹具</title>
  </head>
  <body>
    <main>
      <p>来源：Zent v7 Upload 公开示例页（仅镜像与规则识别相关的最小 DOM）。</p>
      <section>
        <p>上传至分组：请选择 网络图片：</p>
        <label for="zent-local-image">
          本地图片：仅支持 gif、jpeg、png、bmp 4种格式，大小不超过1.0 MB
        </label>
        <input
          id="zent-local-image"
          type="file"
          multiple
          accept="image/gif, image/jpeg, image/png, image/bmp"
        >
      </section>
    </main>
  </body>
</html>
