<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UploadFit V2-S0 音频能力探针</title>
    <link rel="stylesheet" href="./audio-probe.css">
  </head>
  <body>
    <main>
      <h1>UploadFit V2-S0 音频能力探针</h1>
      <p>能力探针不选择、读取或上传用户音频。下方按钮只编码内存中的 1 秒合成 WAV，用于 Worker/编码器烟测。</p>
      <p id="audio-s0-status" role="status">等待探针…</p>
      <button id="audio-s0-run" type="button">重新运行探针</button>
      <button id="audio-s0-encode-small" type="button">运行 1 秒合成 Worker 烟测</button>
      <button id="audio-s0-cancel" type="button">取消当前编码</button>
      <label for="audio-s0-file">选择本地合成 WAV（仅用于真实 Tabbit 门禁）</label>
      <input id="audio-s0-file" type="file" accept=".wav,audio/wav">
      <pre id="audio-s0-capability-output" aria-live="polite">检测中…</pre>
      <h2>编码烟测结果</h2>
      <pre id="audio-s0-encode-output" aria-live="polite">尚未运行</pre>
    </main>
    <script src="./generated/audio-probe.bundle.js"></script>
  </body>
</html>
