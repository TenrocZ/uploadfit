<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <header class="site-header">
      <p class="eyebrow">UploadFit / V2-S3 QA</p>
      <h1>音频稳定测试页 A–H</h1>
      <p class="lede">所有操作均在本地浏览器完成。页面只显示安全元数据，不读取文件名、标签、PCM 或页面外内容；不会自动点击业务提交按钮。</p>
      <nav aria-label="音频测试场景">

        <a data-scenario-link="D" href="./audio-s3.html?scenario=D">D 无 max</a>

        <a data-scenario-link="F" href="./audio-s3.html?scenario=F">F 时长停止</a>
        <a data-scenario-link="G" href="./audio-s3.html?scenario=G">G 取消/脱离</a>
        <a data-scenario-link="H" href="./audio-s3.html?scenario=H">H 一次重试</a>
      </nav>
    </header>

    <main id="audio-s3-root">
      <noscript>需要启用 JavaScript 才能运行稳定测试场景。</noscript>

    <script src="./audio-s3.js"></script>
