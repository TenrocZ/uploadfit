<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="UploadFit S5 本地稳定测试页">
    <title>UploadFit S5 稳定测试页</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="site-header">
      <p class="eyebrow">UploadFit / S5 QA</p>
      <h1>稳定测试页</h1>
      <p class="lede">六个场景都使用本地非敏感 fixture。页面只记录事件和文件元信息，不上传图片，也不会替用户点击最终提交。</p>
      <nav aria-label="测试场景">
        <a data-scenario-link="A" href="./index.html?scenario=A">A 预检适配</a>
        <a data-scenario-link="B" href="./index.html?scenario=B">B 拒收重试</a>
        <a data-scenario-link="C" href="./index.html?scenario=C&amp;variant=confirm">C 裁剪确认</a>
        <a data-scenario-link="D" href="./index.html?scenario=D">D 模糊错误</a>
        <a data-scenario-link="E" href="./index.html?scenario=E">E 表单等待提交</a>
        <a data-scenario-link="F" href="./index.html?scenario=F">F 官方工具</a>
      </nav>
    </header>

    <main id="scenario-root">
      <noscript>需要启用 JavaScript 才能运行稳定测试场景。</noscript>
    </main>

    <script src="./scenarios.js"></script>
    <script src="../dist/uploadfit.js"></script>
  </body>
</html>
